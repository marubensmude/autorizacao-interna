:root{
  --preto:#0E0E0E; --preto2:#171717; --dourado:#BF9B5A; --dourado-esc:#A07E3E; --dourado-cl:#E0C57E;
  --branco:#FFFFFF; --bg:#F5F3EF; --borda:#E4DED3; --texto:#1F1F1F; --suave:#7A7468;
  --ok:#2E7D53; --ok-bg:#E8F3EC; --alerta:#B7791F; --alerta-bg:#FBF1DF; --erro:#A93A2E; --erro-bg:#F8E7E4;
  --azul:#2C5D7C; --azul-bg:#E6EEF4; --neutro-bg:#EFEDE8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Jost',-apple-system,Helvetica,Arial,sans-serif;color:var(--texto);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:9px 11px;border:1px solid var(--borda);border-radius:8px;background:var(--branco);color:var(--texto)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dourado)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label{display:block;font-size:12px;font-weight:500;color:var(--suave);margin-bottom:5px;letter-spacing:.2px}
.hide{display:none!important}
.marca{font-family:'Omnes','Jost',sans-serif;font-weight:700;letter-spacing:.2px}
.marca b{color:var(--dourado);font-weight:700}

/* ---------- Login ---------- */
.login-bg{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1d1d1d,#0b0b0b 70%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.login-card{width:100%;max-width:380px;background:#131313;border:1px solid #2a2a2a;border-radius:16px;padding:34px 28px;text-align:center;color:#eee}
.login-card .marca{font-size:30px;color:#fff}
.login-card .sub{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:#9a9a9a;margin-top:6px}
.login-line{height:1px;background:linear-gradient(90deg,transparent,var(--dourado),transparent);margin:22px 0}
.login-card label{color:#aaa;text-align:left}
.login-card input{background:#1c1c1c;border-color:#333;color:#fff;margin-bottom:14px}
.login-err{color:#e7a59c;font-size:13px;min-height:18px;margin:2px 0 8px}
.login-foot{font-size:11.5px;color:#777;margin-top:18px;line-height:1.6}

/* ---------- Botões ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:500;border-radius:9px;padding:9px 15px;border:1px solid var(--borda);background:var(--branco);color:var(--texto);white-space:nowrap;transition:border-color .15s,opacity .15s}
.btn:hover{border-color:var(--dourado)}
.btn-ouro{background:var(--preto);color:var(--dourado-cl);border-color:var(--preto)}
.btn-ouro:hover{opacity:.9;border-color:var(--preto)}
.btn-perigo{color:var(--erro)}
.btn-perigo:hover{border-color:var(--erro)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn svg{width:15px;height:15px}

/* ---------- Topo ---------- */
.topo{background:var(--preto);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.topo .marca{font-size:21px;color:#fff}
.topo .tit{font-size:11.5px;letter-spacing:2.5px;text-transform:uppercase;color:#aaa;border-left:1px solid #333;padding-left:14px}
.topo .esp{flex:1}
.topo .user{font-size:12px;color:#999}
.topo .btn{background:transparent;color:#ddd;border-color:#333}
.topo .btn:hover{border-color:var(--dourado);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px 22px 60px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--branco);border:1px solid var(--borda);border-radius:12px;padding:15px 17px;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--dourado)}
.kpi .k{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--suave)}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--preto);line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--suave)}

/* ---------- Barra de filtros ---------- */
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--borda);background:var(--branco);color:var(--texto)}
.chip b{font-weight:600;color:var(--suave);margin-left:4px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--preto);border-color:var(--preto);color:#fff}
.chip.on b{color:var(--dourado-cl)}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtros input{width:240px}
.filtros select{width:auto;min-width:130px}

/* ---------- Lista ---------- */
.tabela{background:var(--branco);border:1px solid var(--borda);border-radius:12px;overflow:hidden}
table.lista{width:100%;border-collapse:collapse}
.lista th{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--suave);font-weight:500;text-align:left;padding:11px 14px;border-bottom:1px solid var(--borda);background:#FBFAF7}
.lista td{padding:12px 14px;border-bottom:1px solid #F0ECE4;vertical-align:top}
.lista tr:last-child td{border-bottom:none}
.lista tbody tr{cursor:pointer}
.lista tbody tr:hover td{background:#FCFAF5}
.lista .cod{font-weight:600;font-size:12.5px;white-space:nowrap}
.lista .sub{font-size:12px;color:var(--suave)}
.lista .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vazio{padding:46px 20px;text-align:center;color:var(--suave)}
.badge{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-alerta{background:var(--alerta-bg);color:var(--alerta)}
.b-erro{background:var(--erro-bg);color:var(--erro)}
.b-azul{background:var(--azul-bg);color:var(--azul)}
.b-neutro{background:var(--neutro-bg);color:#666}
.b-ouro{background:#F4ECDD;color:var(--dourado-esc)}

/* ---------- Painel de detalhe ---------- */
.fundo{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:20;display:flex;justify-content:flex-end}
.painel{width:min(920px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.p-topo{background:var(--branco);border-bottom:1px solid var(--borda);padding:16px 22px}
.p-linha1{display:flex;align-items:flex-start;gap:12px}
.p-linha1 .t{flex:1;min-width:0}
.p-cod{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dourado-esc);font-weight:600}
.p-nome{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;line-height:1.15;color:var(--preto);overflow-wrap:anywhere}
.p-info{font-size:12.5px;color:var(--suave);margin-top:2px}
.p-acoes{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.abas{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--borda);margin-bottom:-17px}
.aba{padding:9px 14px;font-size:13px;color:var(--suave);border-bottom:2px solid transparent}
.aba.on{color:var(--preto);border-bottom-color:var(--dourado);font-weight:500}
.p-corpo{flex:1;overflow:auto;padding:20px 22px 40px}
.fechar{width:34px;height:34px;border-radius:50%;border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--suave);background:var(--branco)}
.fechar:hover{border-color:var(--dourado);color:var(--preto)}
.sec{background:var(--branco);border:1px solid var(--borda);border-radius:12px;padding:15px 18px;margin-bottom:12px}
.sec h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--preto);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sec h3 input{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:0 16px;border-bottom:1px dashed #EEE9E0;padding:6px 0;font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--suave)}
.kv .v{color:var(--texto);overflow-wrap:anywhere;white-space:pre-wrap}
.para{font-size:13px;line-height:1.6;color:#333;text-align:justify;margin:6px 0}
.ed-row{display:grid;grid-template-columns:34% 1fr 30px;gap:8px;margin-bottom:6px;align-items:start}
.ed-row textarea{min-height:38px;padding:8px 10px}
.ed-row input{padding:8px 10px}
.x{width:30px;height:36px;border-radius:7px;color:#b3aa9b;font-size:17px}
.x:hover{color:var(--erro);background:var(--erro-bg)}
.ed-para{display:grid;grid-template-columns:1fr 30px;gap:8px;margin-bottom:6px}
.ed-add{font-size:12.5px;color:var(--dourado-esc);padding:4px 0;margin-right:14px}
.ed-add:hover{text-decoration:underline}
.aviso{font-size:12.5px;background:var(--alerta-bg);color:#7a5412;border-radius:9px;padding:10px 13px;margin-bottom:12px;line-height:1.55}
.aviso.azul{background:var(--azul-bg);color:#244c66}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.full{grid-column:1/-1}
.hist{font-size:12.5px;border-left:2px solid var(--borda);padding-left:12px}
.hist div{margin-bottom:8px}
.hist .em{color:var(--suave);font-size:11.5px}
.linkbox{font-size:12px;background:var(--bg);border:1px dashed var(--dourado);border-radius:8px;padding:9px 11px;word-break:break-all;color:var(--suave);margin:8px 0}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--preto);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.toast.erro{background:var(--erro)}
.carregando{padding:40px;text-align:center;color:var(--suave)}

@media(max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .topo .tit,.topo .user{display:none}
  .filtros,.filtros input{width:100%}
  .filtros select{flex:1}
  .lista thead{display:none}
  .lista,.lista tbody,.lista tr,.lista td{display:block;width:100%}
  .lista tr{padding:12px 14px;border-bottom:1px solid #F0ECE4}
  .lista td{border:none;padding:2px 0}
  .lista .num{text-align:left}
  .lista td[data-l]::before{content:attr(data-l) ": ";color:var(--suave);font-size:12px}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .ed-row{grid-template-columns:1fr 30px}
  .ed-row .ed-k{grid-column:1/-1}
}
@media(max-width:520px){
  .wrap{padding:16px 16px 50px}
  .topo{padding:10px 16px;gap:8px}
  .topo .btn span{display:none}
  .kpi .v{font-size:26px}
  .p-topo,.p-corpo{padding-left:16px;padding-right:16px}
}
</style>
</head>

  return comHora ? s + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) : s;
}
function isoParaInput(iso){ if(!iso) return ''; var d = new Date(iso); if(isNaN(d)) return ''; return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()); }
function inputParaISO(v){ if(!v) return ''; var p = v.split('-'); return new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0).toISOString(); }
function moedaBR(n){ return (n || n === 0) ? 'R$ ' + Number(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) : ''; }
function moedaCurta(n){
  if(!n) return 'R$ 0';
  if(n >= 1e6) return 'R$ ' + (n/1e6).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mi';
  if(n >= 1e3) return 'R$ ' + Math.round(n/1e3).toLocaleString('pt-BR') + ' mil';
  return 'R$ ' + n.toLocaleString('pt-BR');
}
function limpaRS(v){ return String(v || '').replace(/(R\$\s*){2,}/g, 'R$ ').trim(); }
function numDeValor(v){
  var s = String(v || '').replace(/R\$/g, '').trim();
  var m = s.match(/\d[\d.]*(,\d{1,2})?/); if(!m) return 0;
  return Number(m[0].replace(/\./g, '').replace(',', '.')) || 0;
}
function soDig(s){ return String(s || '').replace(/\D/g, ''); }

/* ------------------------------------------------------------
   LEITURA DA FICHA (seções) -> resumo usado na lista
   ------------------------------------------------------------ */
function secao(o, re){ var s = o.secoes || []; for(var i=0;i<s.length;i++){ if(re.test(s[i].t || '')) return s[i]; } return null; }
function campo(sec, rotulo){
  if(!sec || !sec.rows) return '';
  var alvo = String(rotulo).toLowerCase();
  for(var i=0;i<sec.rows.length;i++){ if(String(sec.rows[i][0] || '').trim().toLowerCase() === alvo) return String(sec.rows[i][1] || '').trim(); }
  return '';
}
function resumo(o){
  var sP = secao(o, /propriet/i), sI = secao(o, /intermedi/i), sM = secao(o, /imóvel objeto|^\s*3\b/i),
      sC = secao(o, /condições comerciais/i), sA = secao(o, /autorizações e divulga/i), sO = secao(o, /outros imóveis/i);
  var end = campo(sM, 'Endereço');
  var partes = end.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  var bairro = partes.length >= 3 ? partes[partes.length-2] : '';
  var cidade = partes.length ? partes[partes.length-1] : '';
  var valorTxt = limpaRS(campo(sC, 'Valor pretendido'));
  var extras = 0;
  if(sO){
    (sO.paras || []).forEach(function(p){ if(/imóvel adicional/i.test(p)) extras++; });
    var nt = (sO.rows || []).filter(function(rw){ return /^tipo$/i.test(String(rw[0]).trim()); }).length;
    extras = Math.max(extras, nt);
  }
  return {
    nome: campo(sP, 'Nome') || campo(sP, 'Nome / Razão social') || '(sem nome)',
    doc: campo(sP, 'CPF/CNPJ') || campo(sP, 'CPF') || campo(sP, 'CNPJ'),
    email: campo(sP, 'E-mail'),
    tel: campo(sP, 'WhatsApp') || campo(sP, 'Telefone / WhatsApp') || campo(sP, 'Telefone'),
    corretor: (campo(sI, 'Corretor responsável') || '').replace(/\s*\(CRECI[^)]*\)\s*/i, '').trim(),
    tipo: campo(sM, 'Tipo'),
    endereco: end, bairro: bairro, cidade: cidade,
    condominio: campo(sM, 'Condomínio fechado'),
    valorTxt: valorTxt, valor: numDeValor(valorTxt),
    comissao: campo(sC, 'Comissão'),
    modalidade: campo(sA, 'Modalidade'),
    prazo: campo(sA, 'Prazo de autorização'),
    extras: extras
  };
}

/* ------------------------------------------------------------
   PRAZO E SITUAÇÃO
   Formulário do cliente e importadas: prazo prorrogável
   automaticamente (cláusula do termo). Interno: prazo simples.
   ------------------------------------------------------------ */
function prazoDias(p){
  p = String(p || '').toLowerCase();
  if(!p || /vend/.test(p)) return null;
  var m;
  if((m = p.match(/(\d+)\s*dia/))) return +m[1];
  if((m = p.match(/(\d+)\s*m[eê]s/))) return +m[1] * 30;
  if((m = p.match(/(\d+)\s*ano/))) return +m[1] * 365;
  if((m = p.match(/^\s*(\d+)\s*$/))) return +m[1];
  return null;
}
function renovaAuto(o){ return o.origem !== 'interno' && o.origem !== 'manual'; }
function prazoInfo(o){
  var r = resumo(o), dias = prazoDias(r.prazo), base = o.autorizadaEm ? new Date(o.autorizadaEm) : null;
  if(!dias || !base || isNaN(base)) return { dias: null, txt: r.prazo || '—' };
  var DIA = 864e5, fim = new Date(base.getTime() + dias*DIA), hoje = new Date(), ciclo = 1, auto = renovaAuto(o);
  if(auto){ while(fim < hoje){ fim = new Date(fim.getTime() + dias*DIA); ciclo++; } }
  var falta = Math.ceil((fim - hoje) / DIA);
  return { dias: dias, fim: fim, falta: falta, ciclo: ciclo, auto: auto, vencida: !auto && falta < 0, txt: r.prazo };
}
var ST = {
  aguardando: { t: 'Aguardando aceite', c: 'b-azul' },
  autorizada: { t: 'Autorizada', c: 'b-ok' },
  vendida:    { t: 'Vendida', c: 'b-ouro' },
  cancelada:  { t: 'Cancelada', c: 'b-erro' },
  arquivada:  { t: 'Arquivada', c: 'b-neutro' }
};
function situacao(o){
  var s = o.status || 'autorizada';
  if(s !== 'autorizada') return { chave: s, t: (ST[s]||{}).t || s, c: (ST[s]||{}).c || 'b-neutro' };
  var p = prazoInfo(o);
  if(p.vencida) return { chave: 'vencida', t: 'Prazo vencido', c: 'b-erro' };
  if(p.dias && p.falta <= 15) return { chave: 'avencer', t: p.auto ? ('Renova em ' + Math.max(p.falta,0) + 'd') : ('Vence em ' + Math.max(p.falta,0) + 'd'), c: 'b-alerta' };
  return { chave: 'vigente', t: 'Autorizada', c: 'b-ok' };
}
function origemTxt(o){ return ({cliente:'Cliente preencheu', interno:'Interno · aceite por link', importado:'Importada do e-mail', manual:'Lançada manualmente'})[o.origem] || o.origem || ''; }

function iniciar(){
  if(!window.supabase){ $('lgErr').textContent = 'Não foi possível carregar o serviço. Verifique a internet e recarregue a página.'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.getSession().then(function(r){
    var s = r && r.data && r.data.session;
    if(s && s.user) entrouComo(s.user); else mostrarLogin();
  }).catch(mostrarLogin);
}
function mostrarLogin(){ $('telaLogin').classList.remove('hide'); $('app').classList.add('hide'); setTimeout(function(){ $('lgEmail').focus(); }, 50); }
function fazerLogin(){
  var email = $('lgEmail').value.trim().toLowerCase(), senha = $('lgSenha').value;
  if(!email || !senha){ $('lgErr').textContent = 'Informe e-mail e senha.'; return; }
  $('lgErr').textContent = ''; $('lgBtn').disabled = true; $('lgBtn').textContent = 'Entrando…';
  sb.auth.signInWithPassword({ email: email, password: senha }).then(function(r){
    $('lgBtn').disabled = false; $('lgBtn').textContent = 'Entrar';
    if(r.error){ $('lgErr').textContent = /invalid/i.test(r.error.message) ? 'E-mail ou senha incorretos.' : r.error.message; return; }
    entrouComo(r.data.user);
  });
}
function entrouComo(user){
  var email = String(user.email || '').toLowerCase();
  if(ADMINS.indexOf(email) < 0){
    sb.auth.signOut();
    mostrarLogin();
    $('lgErr').textContent = 'Acesso restrito ao administrador.';
    return;
  }
  USER = user;
  $('userEmail').textContent = email;
  $('telaLogin').classList.add('hide'); $('app').classList.remove('hide');
  carregar();
}
function sair(){ sb.auth.signOut().then(function(){ location.reload(); }); }

function carregar(){
  $('corpoLista').innerHTML = '<tr><td colspan="6" class="carregando">Carregando autorizações…</td></tr>';
  return sb.from('autorizacoes').select('id,obj,created_at,updated_at').order('created_at', { ascending: false }).then(function(r){
    if(r.error){
      var msg = /relation|does not exist|schema cache/i.test(r.error.message) ? 'A tabela de autorizações ainda não existe no banco. Rode o arquivo supabase_autorizacoes.sql no Supabase.' : r.error.message;
      $('corpoLista').innerHTML = '<tr><td colspan="6" class="vazio">' + esc(msg) + '</td></tr>';
      return;
    }
    TODAS = (r.data || []).map(function(l){ var o = l.obj || {}; o.id = l.id; o._upd = l.updated_at; o._criado = l.created_at; return o; });
    TODAS.sort(function(a, b){ return String(b.autorizadaEm || b.criadoEm || b._criado).localeCompare(String(a.autorizadaEm || a.criadoEm || a._criado)); });
    montarCorretores(); render();
  });
}
function salvarObj(o, acao){
  var copia = JSON.parse(JSON.stringify(o));
  delete copia._upd; delete copia._criado;
  copia.atualizadoEm = agoraISO();
  if(acao){ copia.historico = (copia.historico || []).concat([{ em: copia.atualizadoEm, acao: acao, por: USER && USER.email }]); }
  return sb.from('autorizacoes').update({ obj: copia }).eq('id', o.id).select('id,obj,updated_at').then(function(r){
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('Nada foi gravado. Confira se você está logado como administrador.');
    var novo = r.data[0].obj; novo.id = r.data[0].id; novo._upd = r.data[0].updated_at;
    for(var i=0;i<TODAS.length;i++){ if(TODAS[i].id === novo.id) TODAS[i] = novo; }
    return novo;

function montarCorretores(){

/* ---------- Edição ---------- */
function lerEdicao(){
  var secs = [];
  document.querySelectorAll('#pCorpo .sec[data-sec]').forEach(function(el){
    var s = { t: el.querySelector('.ed-t').value.trim(), rows: [], paras: [] };
    el.querySelectorAll('.ed-row').forEach(function(rw){
      var k = rw.querySelector('.ed-k').value.trim(), v = rw.querySelector('.ed-v').value.trim();
      if(k || v) s.rows.push([k, v]);
    });
    el.querySelectorAll('.ed-p').forEach(function(p){ var t = p.value.trim(); if(t) s.paras.push(t); });
    if(s.t || s.rows.length || s.paras.length) secs.push(s);
  });
  return secs;
}
function diffSecoes(a, b){
  var mapa = function(ss){ var m = {}; (ss || []).forEach(function(s){ (s.rows || []).forEach(function(r){ m[s.t + ' › ' + r[0]] = r[1]; }); (s.paras||[]).forEach(function(p, i){ m[s.t + ' › parágrafo ' + (i+1)] = p; }); }); return m; };
  var ma = mapa(a), mb = mapa(b), mud = [];
  Object.keys(mb).forEach(function(k){ if(ma[k] !== mb[k]) mud.push(k.split(' › ').pop()); });
  Object.keys(ma).forEach(function(k){ if(!(k in mb)) mud.push(k.split(' › ').pop() + ' (removido)'); });
  return mud;
}
function salvarEdicao(){
  var novas = lerEdicao(), antes = TODAS.filter(function(x){ return x.id === ATUAL.id; })[0];
  var mud = diffSecoes(antes ? antes.secoes : [], novas);
  if(!mud.length){ EDITANDO = false; desenharPainel(); toast('Nenhuma alteração.'); return; }
  ATUAL.secoes = novas;
  if(ATUAL.status !== 'aguardando') ATUAL.fichaEditadaEm = agoraISO();
  var acao = 'Ficha editada: ' + mud.slice(0, 8).join(', ') + (mud.length > 8 ? ' e mais ' + (mud.length - 8) : '');
  travar(true);
  salvarObj(ATUAL, acao).then(function(novo){
    ATUAL = JSON.parse(JSON.stringify(novo)); EDITANDO = false; desenharPainel(); render(); toast('Alterações salvas.');
  }).catch(function(e){ travar(false); toast('Não foi possível salvar: ' + (e.message || e), true); });
}
function salvarControle(){
  var o = ATUAL, mud = [];
  var st = $('cStatus').value, dt = inputParaISO($('cData').value), ce = $('cCorEmail').value.trim().toLowerCase(), de = inputParaISO($('cDataEnc').value), nt = $('cNotas').value;
  if(st !== (o.status || 'autorizada')){ mud.push('Status: ' + ((ST[o.status]||{}).t || o.status || '—') + ' → ' + ST[st].t); o.status = st; }
  if(isoParaInput(dt) !== isoParaInput(o.autorizadaEm)){ mud.push('Data da autorização: ' + (dataBR(o.autorizadaEm) || '—') + ' → ' + (dataBR(dt) || '—')); o.autorizadaEm = dt || null; }
  if(ce !== (o.corretorEmail || '')){ mud.push('E-mail do corretor'); o.corretorEmail = ce; }
  if(isoParaInput(de) !== isoParaInput(o.encerradaEm)){ mud.push('Data da venda/encerramento: ' + (dataBR(de) || '—')); o.encerradaEm = de || null; }
  if(nt !== (o.notas || '')){ mud.push('Anotações internas'); o.notas = nt; }
  if(!mud.length){ toast('Nenhuma alteração.'); return; }
  if(st === 'autorizada' && !o.autorizadaEm) o.autorizadaEm = agoraISO();
  travar(true);
  salvarObj(o, mud.join(' · ')).then(function(novo){
    ATUAL = JSON.parse(JSON.stringify(novo)); desenharPainel(); render(); toast('Controle salvo.');
  }).catch(function(e){ travar(false); toast('Não foi possível salvar: ' + (e.message || e), true); });
}
function excluir(){
  var r = resumo(ATUAL);
  if(!confirm('Excluir definitivamente a autorização ' + (ATUAL.codigo || '') + ' de ' + r.nome + '?\n\nPara tirar da carteira sem apagar, prefira o status Cancelada ou Arquivada.')) return;
  if(prompt('Para confirmar, digite EXCLUIR') !== 'EXCLUIR') return;
  sb.from('autorizacoes').delete().eq('id', ATUAL.id).select('id').then(function(res){
    if(res.error || !res.data || !res.data.length){ toast('Não foi possível excluir.' + (res.error ? ' ' + res.error.message : ''), true); return; }
    TODAS = TODAS.filter(function(x){ return x.id !== ATUAL.id; });

      + [l.codigo, l.data, l.nome + (l.doc ? '<br><span style="color:#888">' + esc(l.doc) + '</span>' : ''), esc(l.tel) + (l.email ? '<br><span style="color:#888">' + esc(l.email) + '</span>' : ''), esc(l.tipo), esc(l.condominio && l.condominio !== 'Sim' ? l.condominio + ' · ' : '') + esc(l.endereco), l.valor ? moedaBR(l.valor) : '', esc(l.prazo) + (l.fim ? '<br><span style="color:#888">até ' + l.fim + '</span>' : ''), esc(l.situacao) + (l.corretor ? '<br><span style="color:#888">' + esc(l.corretor) + '</span>' : '')]
        .map(function(c, j){ return '<td style="padding:5px;border-bottom:1px solid #eee;vertical-align:top' + (j === 6 ? ';text-align:right;white-space:nowrap' : (j < 2 ? ';white-space:nowrap' : '')) + '">' + (j === 0 || j === 1 ? esc(c) : c) + '</td>'; }).join('') + '</tr>'; }).join('')
    + '</tbody></table><div style="font-size:9px;color:#999;text-align:center;margin-top:14px">MRM Negócios e Consultorias Imobiliárias Ltda. — Mude Imóveis · CRECI/MS 6052-J · Dourados-MS · Mude que a Gente te Acompanha.</div></div>';
  janelaImpressao('Relacao-Autorizacoes-Mude', h, true);
}
function planilha(){
  var L = linhasRelacao();
  var cab = ['Código','Data da autorização','Proprietário','CPF/CNPJ','Telefone','E-mail','Tipo','Endereço','Condomínio','Valor (R$)','Modalidade','Prazo','Fim do período','Situação','Origem','Corretor','Anotações'];
  var h = '\ufeff<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1"><tr>'
    + cab.map(function(c){ return '<th style="background:#111;color:#E0C57E">' + c + '</th>'; }).join('') + '</tr>'
    + L.map(function(l){ return '<tr>' + [l.codigo, l.data, l.nome, l.doc, l.tel, l.email, l.tipo, l.endereco, l.condominio].map(function(c){ return '<td style="mso-number-format:\'\\@\'">' + esc(c) + '</td>'; }).join('')
      + '<td style="mso-number-format:\'#,##0.00\'">' + (l.valor || '') + '</td>'
      + [l.modalidade, l.prazo, l.fim, l.situacao, l.origem, l.corretor, l.notas].map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('')
    + '</table></body></html>';
  baixar(new Blob([h], { type: 'application/vnd.ms-excel' }), 'Autorizacoes-Mude-' + isoParaInput(agoraISO()) + '.xls');
}

/* ------------------------------------------------------------
   EVENTOS
   ------------------------------------------------------------ */
$('lgBtn').addEventListener('click', fazerLogin);
$('lgSenha').addEventListener('keydown', function(e){ if(e.key === 'Enter') fazerLogin(); });
$('lgEmail').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('lgSenha').focus(); });
$('btnSair').addEventListener('click', sair);
$('btnAtualizar').addEventListener('click', function(){ carregar().then(function(){ toast('Lista atualizada.'); }); });
$('btnPlanilha').addEventListener('click', planilha);
$('btnImprimirLista').addEventListener('click', imprimirRelacao);
$('btnNova').addEventListener('click', lancarManual);
$('fBusca').addEventListener('input', render);
$('fOrigem').addEventListener('change', render);
$('fCorretor').addEventListener('change', render);
$('chips').addEventListener('click', function(e){ var b = e.target.closest('[data-f]'); if(b){ FILTRO = b.dataset.f; render(); } });
$('kpis').addEventListener('click', function(e){ var b = e.target.closest('[data-f]'); if(b){ FILTRO = b.dataset.f; render(); } });
$('corpoLista').addEventListener('click', function(e){ var tr = e.target.closest('tr[data-id]'); if(tr) abrir(tr.dataset.id); });
$('fundo').addEventListener('click', function(e){ if(e.target === $('fundo')) fechar(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !$('fundo').classList.contains('hide')) fechar(); });
$('painel').addEventListener('click', function(e){
  var t = e.target, b = t.closest('button,a'); if(!b) return;
  var id = b.id;
  if(id === 'pFechar') return fechar();
  if(b.dataset.aba){
    if(EDITANDO && b.dataset.aba !== 'ficha'){ toast('Salve ou cancele a edição antes de trocar de aba.'); return; }
    ABA = b.dataset.aba; return desenharPainel();
  }
  if(id === 'pEditar'){ EDITANDO = true; ABA = 'ficha'; return desenharPainel(); }
  if(id === 'pCancelar'){ ATUAL = JSON.parse(JSON.stringify(TODAS.filter(function(x){ return x.id === ATUAL.id; })[0])); EDITANDO = false; return desenharPainel(); }
  if(id === 'pSalvar') return salvarEdicao();
  if(id === 'pImprimir') return imprimir(ATUAL);
  if(id === 'pWord') return baixarWord(ATUAL);
  if(id === 'pCopiar') return copiar(textoFicha(ATUAL), 'Dados da ficha copiados.');
  if(id === 'pOriginal') return janelaImpressao(nomeArquivo(ATUAL) + '-original', ATUAL.documentoHtml);
  if(id === 'pCopiarLink') return copiar(ATUAL.linkAceite, 'Link copiado.');
  if(id === 'pWaLink'){
    var r = resumo(ATUAL), n = soDig(r.tel); if(n && n.length <= 11) n = '55' + n;
    var msg = 'Olá, ' + (r.nome.split(' ')[0] || '') + '. Aqui é da Mude Imóveis. Segue novamente o link para conferir e aceitar a autorização de venda do seu imóvel. Leva menos de um minuto:\n\n' + ATUAL.linkAceite;
    return window.open('https://wa.me/' + (n || '') + '?text=' + encodeURIComponent(msg), '_blank');
  }
  if(id === 'cSalvar') return salvarControle();
  if(id === 'cExcluir') return excluir();
  if(id === 'pAddSec'){ ATUAL.secoes = lerEdicao().concat([{ t: 'Nova seção', rows: [['', '']], paras: [] }]); return redesenharFicha(); }
  if(b.dataset.addrow !== undefined){ var s1 = lerEdicaoCompleta(); s1[+b.dataset.addrow].rows.push(['', '']); ATUAL.secoes = s1; return redesenharFicha(); }
  if(b.dataset.addpara !== undefined){ var s2 = lerEdicaoCompleta(); s2[+b.dataset.addpara].paras.push(''); ATUAL.secoes = s2; return redesenharFicha(); }
  if(b.dataset.rmsec !== undefined){ if(!confirm('Remover esta seção inteira?')) return; var s3 = lerEdicaoCompleta(); s3.splice(+b.dataset.rmsec, 1); ATUAL.secoes = s3; return redesenharFicha(); }
  if(b.dataset.rm){ var linha = b.parentNode; linha.remove(); return; }
});
/* Lê a edição mantendo linhas vazias (para acrescentar campos sem perder o índice das seções) */
function lerEdicaoCompleta(){
  var secs = [];
  document.querySelectorAll('#pCorpo .sec[data-sec]').forEach(function(el){
    var s = { t: el.querySelector('.ed-t').value, rows: [], paras: [] };
    el.querySelectorAll('.ed-row').forEach(function(rw){ s.rows.push([rw.querySelector('.ed-k').value, rw.querySelector('.ed-v').value]); });
    el.querySelectorAll('.ed-p').forEach(function(p){ s.paras.push(p.value); });
    secs.push(s);
  });
  return secs;
}
function redesenharFicha(){ var sc = $('pCorpo').scrollTop; $('pCorpo').innerHTML = abaFicha(); $('pCorpo').scrollTop = sc; autoAltura(); }
function autoAltura(){ document.querySelectorAll('#pCorpo textarea.ed-v').forEach(function(t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 260) + 'px'; }); }
$('painel').addEventListener('input', function(e){ if(e.target.classList.contains('ed-v')){ e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight + 2, 260) + 'px'; } });
new MutationObserver(function(){ if(EDITANDO) autoAltura(); }).observe($('painel'), { childList: true });

iniciar();
document.documentElement.setAttribute('data-mude-build', BUILD);
</script>
